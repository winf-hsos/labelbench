<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labelbench report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --good: #0ca30c;
  --good-text: #006300;
  --bad: #d03b3b;
  --warn: #fab219;
  --info: #2a78d6;
  --flag: #eda100;
  --seq-0: #fcfcfb; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
  --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10); --accent: #3987e5; --good-text: #0ca30c;
    --seq-0: #1a1a19;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
  --border: rgba(255,255,255,0.10); --accent: #3987e5; --good-text: #0ca30c;
  --seq-0: #1a1a19;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; }
header h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
header .sub { color: var(--ink-2); }
header .desc { color: var(--ink-2); margin-top: 6px; max-width: 75ch; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin: 20px 0 16px; border-bottom: 1px solid var(--grid); }
nav button {
  border: 0; background: none; color: var(--ink-2); font: inherit; padding: 8px 12px;
  border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 12px;
  background: var(--surface-2); color: var(--ink-2); margin-left: 4px; }
.badge.warn { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink); }
.badge.err { background: color-mix(in srgb, var(--bad) 25%, transparent); color: var(--ink); }
section[hidden] { display: none; }
h2 { font-size: 17px; margin: 28px 0 6px; font-weight: 650; }
h2:first-child { margin-top: 4px; }
.expl { color: var(--ink-2); max-width: 80ch; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile .name { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 34px; font-weight: 650; line-height: 1.15; margin: 4px 0; }
.tile .ci { color: var(--ink-2); font-size: 13px; }
.tile .bar { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; margin: 10px 0 4px; }
.tile .bar .ciband { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 3px; }
.tile .bar .point { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--accent); }
.tile .small { color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
td.num, th.num { text-align: right; }
.metrics td:first-child { white-space: nowrap; font-weight: 600; }
.metrics td.explain { color: var(--ink-2); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.controls label { color: var(--ink-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
select, input[type="search"], button.btn {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; max-width: 100%;
}
input[type="search"] { min-width: 220px; }
button.btn { cursor: pointer; }
button.btn:hover { background: var(--surface-2); }
.count { color: var(--ink-2); margin-left: auto; }
.status { white-space: nowrap; font-weight: 600; }
.status.ok { color: var(--good-text); }
.status.no { color: var(--bad); }
.item-row { cursor: pointer; }
.item-row:hover td { background: var(--surface-2); }
.item-row.open td { background: var(--surface-2); }
.feat-main { font-weight: 600; }
.feat-other { color: var(--ink-2); white-space: pre-line; font-size: 13px; }
.feat-name { color: var(--muted); font-size: 12px; }
.lbl { display: inline-block; }
.lbl.invalid { color: var(--bad); font-style: italic; }
.detail td { background: var(--surface); padding: 12px 16px 16px; }
.detail .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.detail h4 { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 12.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: var(--surface-2); padding: 8px 10px; border-radius: 6px; }
.flagged td:first-child { box-shadow: inset 3px 0 0 var(--flag); }
.flagmark { color: var(--flag); font-weight: 700; }
.matrix { border-collapse: separate; border-spacing: 2px; width: auto; }
.matrix th { font-size: 12px; font-weight: 500; border: 0; padding: 4px 6px; }
.matrix th.col { writing-mode: vertical-rl; transform: rotate(180deg); vertical-align: bottom; max-height: 160px; }
.matrix td.cell { width: 44px; height: 34px; text-align: center; border: 0; border-radius: 4px; cursor: pointer; padding: 0; font-size: 12.5px; }
.matrix td.cell.diag { outline: 2px solid var(--ink-2); outline-offset: -2px; }
.matrix td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.axis-note { color: var(--muted); font-size: 12px; }
.pairs li { margin: 2px 0; }
.pairs button { all: unset; cursor: pointer; color: var(--ink); }
.pairs button:hover { text-decoration: underline; }
.issue { border-left: 3px solid var(--grid); padding: 8px 12px; margin: 10px 0; background: var(--surface); border-radius: 0 8px 8px 0; }
.issue.error { border-left-color: var(--bad); }
.issue.warning { border-left-color: var(--warn); }
.issue.info { border-left-color: var(--info); }
.issue .sev { font-weight: 650; margin-right: 6px; }
.issue details { margin-top: 4px; }
.issue summary { cursor: pointer; color: var(--ink-2); }
.issue ul { margin: 6px 0 0; padding-left: 20px; font-size: 13px; }
.notice { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; word-break: break-word; }
.more { margin-top: 12px; }
#tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; max-width: 320px; z-index: 10; }
@media (max-width: 640px) {
  .tile .value { font-size: 28px; }
  input[type="search"] { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <nav id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>
<div id="tooltip" hidden></div>
<script type="application/json" id="data">__LABELBENCH_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const INVALID = "__invalid__";
const PAGE = 200;

const STRINGS = {
  en: {
    report: "Evaluation report", compareReport: "Comparison report",
    tabs: { overview: "Overview", classes: "Classes", items: "Items", checks: "Data checks",
            details: "Run details", changes: "Changed items" },
    exact: "Exact label", level: "Level",
    accuracy: "Accuracy",
    accuracyExpl: "Share of items whose predicted label equals the gold label.",
    ofCorrect: (c, n) => `${c} of ${n} items correct`,
    ci: (lo, hi) => `95 % interval ${lo} – ${hi}`,
    ciExpl: "The shaded band is the 95 % interval: the range of values that is plausible given the number of items. A wide band means the gold standard is too small to distinguish small differences.",
    furtherMetrics: "Further metrics",
    macroF1: "Macro-F1",
    macroF1Expl: (k) => `Average quality per class, each of the ${k} classes in the gold standard counting equally regardless of its size. A value well below the accuracy means that some rarer classes are rarely recognised.`,
    kappa: "Cohen's κ",
    kappaExpl: "Agreement with the gold standard corrected for chance. 0 means no better than guessing by label frequencies, 1 means perfect agreement.",
    invalid: "Invalid answers",
    invalidExpl: "Share of items for which the classifier gave no label or a label outside the label list. They count as errors.",
    weighted: "Weighted accuracy",
    weightedExpl: (c) => `Accuracy in which each item counts with its weight from column “${c}”.`,
    topk: (k) => `Top-${k} accuracy`,
    topkExpl: (k) => `Share of items whose gold label is among the classifier's first ${k} suggestions.`,
    levelGoldNote: (lv, col) => `For “${lv}”, each item is compared with its own value in column “${col}”, not with the value derived from its gold label.`,
    matrix: "Confusion matrix",
    matrixExpl: "Rows are gold labels, columns predicted labels; the outlined diagonal holds the correct predictions. The colour shows which share of a row's items ended up in a column. Click a cell to see its items.",
    goldAxis: "gold ↓", predAxis: "predicted →",
    confusions: "Most frequent mix-ups",
    confusionsExpl: "Pairs of gold label and predicted label that occur most often among the errors. Click a pair to see its items.",
    noErrors: "No errors on this level.",
    classesExpl: "Precision is the share of items predicted as a label that are correct, recall the share of a label's gold items that were found, and F1 combines both. Support is the number of gold items; for labels with only a few items these numbers are anecdotal. Click a row to see its items.",
    col: { label: "Label", support: "Support", predicted: "Predicted", correct: "Correct",
           precision: "Precision", recall: "Recall", f1: "F1", id: "Id", gold: "Gold",
           pred: "Prediction", status: "" },
    filterLabels: "Filter labels…",
    status: "Status", all: "all", right: "correct", wrong: "wrong",
    goldLabel: "Gold label", predLabel: "Predicted label", any: "any",
    search: "Search text…", nItems: (n) => `${n} items`, nLabels: (n) => `${n} labels`, showMore: (n) => `Show ${n} more`,
    reset: "Reset filters",
    rawOutput: "Raw classifier output", candidates: "Candidates", meta: "Metadata",
    levels: "Levels", features: "Features", extra: "Additional columns",
    flag: "Mark gold label as doubtful", unflag: "Remove mark",
    flagged: "Gold label doubtful",
    exportFlags: (n) => `Export marked items (${n}) as CSV`,
    flagHint: "Marks are stored in this browser only. Export them as CSV to pass them on.",
    noneMarked: "No items marked yet.",
    checksExpl: "Consistency checks of the label list and the gold standard, run on the complete task before this run. Errors block runs, warnings can distort results, notes are for information.",
    sev: { error: "Error", warning: "Warning", info: "Note" },
    noIssues: "No issues found.",
    examples: (n, shown) => shown < n ? `Show ${shown} of ${n} cases` : `Show ${n} cases`,
    provenance: "Provenance", configuration: "Classifier configuration",
    created: "Created", split: "Split", allItems: "all", runtime: "Runtime",
    items: "Items", classifier: "Classifier",
    cmpExpl: "Both runs are compared on the same items. “Became correct” counts items the second run gets right and the first got wrong, “became wrong” the reverse.",
    runA: "Run A", runB: "Run B", delta: "Change",
    fixed: "became correct", broken: "became wrong", bothRight: "both correct", bothWrong: "both wrong",
    changed: "changed", pvalue: "p-value (McNemar)",
    pExpl: "Probability of seeing at least this imbalance between items that became correct and items that became wrong if both classifiers were equally good. Below 0.05 the difference is unlikely to be chance.",
    sec: "s",
  },
  de: {
    report: "Auswertungsbericht", compareReport: "Vergleichsbericht",
    tabs: { overview: "Überblick", classes: "Klassen", items: "Einzelfälle", checks: "Datenprüfung",
            details: "Laufdetails", changes: "Geänderte Fälle" },
    exact: "Exaktes Label", level: "Ebene",
    accuracy: "Trefferquote",
    accuracyExpl: "Anteil der Fälle, in denen das vorhergesagte Label mit dem Gold-Label übereinstimmt.",
    ofCorrect: (c, n) => `${c} von ${n} Fällen richtig`,
    ci: (lo, hi) => `95-%-Intervall ${lo} – ${hi}`,
    ciExpl: "Das schattierte Band ist das 95-%-Intervall, also der Bereich, der bei dieser Zahl von Fällen plausibel ist. Ein breites Band bedeutet, dass der Goldstandard zu klein ist, um kleine Unterschiede zu erkennen.",
    furtherMetrics: "Weitere Kennzahlen",
    macroF1: "Macro-F1",
    macroF1Expl: (k) => `Durchschnittliche Qualität pro Klasse, wobei jede der ${k} Klassen im Goldstandard unabhängig von ihrer Größe gleich zählt. Liegt der Wert deutlich unter der Trefferquote, werden seltenere Klassen oft nicht erkannt.`,
    kappa: "Cohens κ",
    kappaExpl: "Übereinstimmung mit dem Goldstandard, bereinigt um Zufallstreffer. 0 heißt nicht besser als Raten nach Häufigkeit der Labels, 1 heißt vollständige Übereinstimmung.",
    invalid: "Ungültige Antworten",
    invalidExpl: "Anteil der Fälle, in denen der Klassifikator kein Label oder eines außerhalb der Labelliste geliefert hat. Sie zählen als Fehler.",
    weighted: "Gewichtete Trefferquote",
    weightedExpl: (c) => `Trefferquote, bei der jeder Fall mit seinem Gewicht aus der Spalte „${c}“ zählt.`,
    topk: (k) => `Top-${k}-Trefferquote`,
    topkExpl: (k) => `Anteil der Fälle, deren Gold-Label unter den ersten ${k} Vorschlägen des Klassifikators ist.`,
    levelGoldNote: (lv, col) => `Für „${lv}“ wird jeder Fall mit seinem eigenen Wert in der Spalte „${col}“ verglichen, nicht mit dem aus seinem Gold-Label abgeleiteten Wert.`,
    matrix: "Konfusionsmatrix",
    matrixExpl: "Zeilen sind Gold-Labels, Spalten vorhergesagte Labels; auf der umrandeten Diagonale stehen die richtigen Vorhersagen. Die Farbe zeigt, welcher Anteil der Fälle einer Zeile in einer Spalte gelandet ist. Ein Klick auf eine Zelle zeigt ihre Fälle.",
    goldAxis: "Gold ↓", predAxis: "Vorhersage →",
    confusions: "Häufigste Verwechslungen",
    confusionsExpl: "Paare aus Gold-Label und vorhergesagtem Label, die unter den Fehlern am häufigsten vorkommen. Ein Klick auf ein Paar zeigt seine Fälle.",
    noErrors: "Keine Fehler auf dieser Ebene.",
    classesExpl: "Precision ist der Anteil der als Label vorhergesagten Fälle, der stimmt, Recall der Anteil der Gold-Fälle eines Labels, der gefunden wurde, und F1 fasst beide zusammen. Support ist die Zahl der Gold-Fälle; bei Labels mit nur wenigen Fällen sind diese Zahlen nur Einzelbeobachtungen. Ein Klick auf eine Zeile zeigt ihre Fälle.",
    col: { label: "Label", support: "Support", predicted: "Vorhergesagt", correct: "Richtig",
           precision: "Precision", recall: "Recall", f1: "F1", id: "Id", gold: "Gold",
           pred: "Vorhersage", status: "" },
    filterLabels: "Labels filtern…",
    status: "Status", all: "alle", right: "richtig", wrong: "falsch",
    goldLabel: "Gold-Label", predLabel: "Vorhergesagtes Label", any: "beliebig",
    search: "Text suchen…", nItems: (n) => `${n} Fälle`, nLabels: (n) => `${n} Labels`, showMore: (n) => `${n} weitere anzeigen`,
    reset: "Filter zurücksetzen",
    rawOutput: "Rohausgabe des Klassifikators", candidates: "Kandidaten", meta: "Metadaten",
    levels: "Ebenen", features: "Merkmale", extra: "Weitere Spalten",
    flag: "Gold-Label als zweifelhaft markieren", unflag: "Markierung entfernen",
    flagged: "Gold-Label zweifelhaft",
    exportFlags: (n) => `Markierte Fälle (${n}) als CSV exportieren`,
    flagHint: "Markierungen werden nur in diesem Browser gespeichert. Zum Weitergeben als CSV exportieren.",
    noneMarked: "Noch keine Fälle markiert.",
    checksExpl: "Konsistenzprüfungen von Labelliste und Goldstandard, ausgeführt auf der vollständigen Aufgabe vor diesem Lauf. Fehler verhindern Läufe, Warnungen können Ergebnisse verzerren, Hinweise dienen der Information.",
    sev: { error: "Fehler", warning: "Warnung", info: "Hinweis" },
    noIssues: "Keine Auffälligkeiten gefunden.",
    examples: (n, shown) => shown < n ? `${shown} von ${n} Fällen anzeigen` : `${n} Fälle anzeigen`,
    provenance: "Herkunft", configuration: "Konfiguration des Klassifikators",
    created: "Erstellt", split: "Split", allItems: "alle", runtime: "Laufzeit",
    items: "Fälle", classifier: "Klassifikator",
    cmpExpl: "Beide Läufe werden auf denselben Fällen verglichen. „Richtig geworden“ zählt Fälle, die der zweite Lauf richtig und der erste falsch hat, „falsch geworden“ das Umgekehrte.",
    runA: "Lauf A", runB: "Lauf B", delta: "Änderung",
    fixed: "richtig geworden", broken: "falsch geworden", bothRight: "beide richtig", bothWrong: "beide falsch",
    changed: "geändert", pvalue: "p-Wert (McNemar)",
    pExpl: "Wahrscheinlichkeit, mindestens dieses Ungleichgewicht zwischen richtig und falsch gewordenen Fällen zu sehen, wenn beide Klassifikatoren in Wahrheit gleich gut wären. Unter 0,05 ist der Unterschied wahrscheinlich kein Zufall.",
    sec: "s",
  },
};
const CHECK_TEXT_DE = {
  duplicate_label: "Labels, die mehrfach in labels.csv vorkommen.",
  empty_label: "Zeilen in labels.csv ohne Label.",
  reserved_label: "__invalid__ ist für ungültige Vorhersagen reserviert.",
  label_whitespace: "Labels mit Leerzeichen am Anfang oder Ende; sie passen nur zu Gold-Labels mit genau denselben Leerzeichen.",
  similar_labels: "Fast gleiche Labels. Wenn sie dasselbe meinen, wird ein Klassifikator für die Wahl des „falschen“ Zwillings bestraft; Zusammenlegen erwägen.",
  unused_labels: "Labels, die im Goldstandard nie vorkommen, sodass ihre Qualität nicht messbar ist.",
  duplicate_id: "Ids, die mehrfach in gold.csv vorkommen.",
  empty_gold_label: "Fälle ohne Gold-Label.",
  unknown_gold_label: "Gold-Labels, die nicht in labels.csv stehen.",
  bad_weight: "Gewichte, die keine nicht-negativen Zahlen sind.",
  unknown_split: "Werte in der Split-Spalte außer dev und test; diese Fälle werden standardmäßig nie ausgewertet.",
  empty_features: "Fälle, deren Merkmalsspalten alle leer sind.",
  singleton_classes: "Labels mit genau einem Gold-Fall; Zahlen pro Klasse sind für sie nur Einzelbeobachtungen.",
  empty_level_value: "Labels ohne Wert auf einer Ebene.",
  unknown_level_value: "Werte einer Gold-Ebenenspalte, die auf dieser Ebene in labels.csv nicht vorkommen.",
  level_gold_mismatch: "Fälle, deren eigener Wert auf einer Ebene von dem ihres Gold-Labels abweicht. Die Auswertung auf dieser Ebene verwendet den eigenen Wert des Falls.",
  conflicting_duplicates: "Fälle mit identischen Merkmalen, aber unterschiedlichen Gold-Labels. Kein Klassifikator kann alle richtig haben.",
  repeated_items: "Fälle, die Merkmale und Label eines anderen Falls wiederholen; dieselbe Eingabe zählt damit mehrfach.",
};
const LANG = STRINGS[DATA.language] ? DATA.language : "en";
const T = STRINGS[LANG];
document.documentElement.lang = LANG;
const NUM = new Intl.NumberFormat(LANG, { maximumFractionDigits: 2 });
const PCT = (x, d = 0) => x == null ? "–" : new Intl.NumberFormat(LANG, { style: "percent", maximumFractionDigits: d, minimumFractionDigits: d }).format(x);
const F2 = (x) => x == null ? "–" : new Intl.NumberFormat(LANG, { maximumFractionDigits: 2, minimumFractionDigits: 2 }).format(x);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = (sel, root = document) => root.querySelector(sel);
const levelName = (lv) => lv === "label" ? T.exact : lv;
const labelHtml = (l) => l === INVALID ? `<span class="lbl invalid">${LANG === "de" ? "ungültig" : "invalid"}</span>` : `<span class="lbl">${esc(l)}</span>`;
const statusHtml = (ok) => ok ? `<span class="status ok">✓ ${T.right}</span>` : `<span class="status no">✗ ${T.wrong}</span>`;

// ---------- tooltip ----------
const tip = $("#tooltip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px";
  tip.style.top = (e.clientY + 16) + "px";
});

// ---------- flags (gold label doubtful) ----------
const FLAG_KEY = "labelbench-flags:" + (DATA.run_name || DATA.title);
let FLAGS = {};
try { FLAGS = JSON.parse(localStorage.getItem(FLAG_KEY) || "{}"); } catch (e) { FLAGS = {}; }
function saveFlags() { try { localStorage.setItem(FLAG_KEY, JSON.stringify(FLAGS)); } catch (e) {} }

// ---------- tabs ----------
const TABS = DATA.kind === "compare" ? ["overview", "changes", "details"]
                                     : ["overview", "classes", "items", "checks", "details"];
let currentTab = "overview";
function renderTabs() {
  const nav = $("#tabs");
  nav.innerHTML = TABS.map((t) => {
    let badge = "";
    if (t === "checks") {
      const errs = DATA.issues.filter((i) => i.severity === "error").length;
      const warns = DATA.issues.filter((i) => i.severity === "warning").length;
      if (errs) badge += `<span class="badge err">${errs}</span>`;
      if (warns) badge += `<span class="badge warn">${warns}</span>`;
    }
    if (t === "items" && Object.keys(FLAGS).length) badge = `<span class="badge">⚑ ${Object.keys(FLAGS).length}</span>`;
    return `<button role="tab" data-tab="${t}" aria-selected="${t === currentTab}">${T.tabs[t]}${badge}</button>`;
  }).join("");

function matrixHtml(level, mx) {

  mx.counts.forEach((r, i) => {

    r.forEach((c, j) => {

      const dark = share > 0.45;
      const tipText = `${T.col.gold}: ${labels[i]} · ${T.col.pred}: ${labels[j]} · ${T.nItems(c)} (${PCT(share)})`;
      h += `<td class="cell${i === j ? " diag" : ""}" style="background:${shade(share)};color:${dark ? "#fff" : "var(--ink)"}"

function cmpStatus(it, level) {
  const a = it.a.levels[level], b = it.b.levels[level];
  const ra = a.gold === a.pred, rb = b.gold === b.pred;
  if (!ra && rb) return "fixed";
  if (ra && !rb) return "broken";
  return ra ? "both_right" : "both_wrong";
}
function renderChanges() {
  const sec = $("#tab-changes");
  const levels = Object.keys(DATA.comparison.levels);
  const q = C.q.toLowerCase();
  const rows = DATA.items.filter((it) => {
    const s = cmpStatus(it, C.level);
    if (C.status === "changed" && !(s === "fixed" || s === "broken")) return false;
    if (!["changed", "all"].includes(C.status) && s !== C.status) return false;
    if (q && ![it.id, it.gold, it.a.pred, it.b.pred, it.a.raw, it.b.raw, ...Object.values(it.features)].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
  const statusLabel = { fixed: "✓ " + T.fixed, broken: "✗ " + T.broken, both_right: T.bothRight, both_wrong: T.bothWrong };
  sec.innerHTML = `<div class="controls">
      <label>${T.level} <select id="c-level">${levels.map((n) => `<option value="${esc(n)}"${n === C.level ? " selected" : ""}>${esc(levelName(n))}</option>`).join("")}</select></label>
      <label>${T.status} <select id="c-status">${[["changed", T.changed], ["fixed", T.fixed], ["broken", T.broken], ["both_wrong", T.bothWrong], ["both_right", T.bothRight], ["all", T.all]]
        .map(([v, l]) => `<option value="${v}"${v === C.status ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
      <input type="search" id="c-q" placeholder="${esc(T.search)}" value="${esc(C.q)}">
      <span class="count">${T.nItems(rows.length)}</span>
    </div>
    <div class="card scroll"><table><thead><tr><th>${T.col.id}</th><th>${T.features}</th><th>${T.col.gold}</th><th>${T.runA}</th><th>${T.runB}</th><th></th></tr></thead><tbody>
    ${rows.slice(0, C.limit).map((it) => {
      const s = cmpStatus(it, C.level);
      const a = it.a.levels[C.level], b = it.b.levels[C.level];
      const cls = s === "fixed" ? "ok" : s === "broken" ? "no" : "";
      return `<tr class="item-row${cmpOpen === it.id ? " open" : ""}" data-id="${esc(it.id)}"><td>${esc(it.id)}</td><td>${featureCell(it.features)}</td>
        <td>${labelHtml(a.gold)}</td><td>${labelHtml(a.pred)}</td><td>${labelHtml(b.pred)}</td><td><span class="status ${cls}">${esc(statusLabel[s])}</span></td></tr>
        ${cmpOpen === it.id ? `<tr class="detail"><td colspan="6"><div class="grid">
          <div><h4>${T.runA}: ${T.rawOutput}</h4><pre>${prettyRaw(it.a.raw)}</pre></div>
          <div><h4>${T.runB}: ${T.rawOutput}</h4><pre>${prettyRaw(it.b.raw)}</pre></div></div></td></tr>` : ""}`;
    }).join("")}
    </tbody></table></div>
    ${rows.length > C.limit ? `<div class="more"><button class="btn" id="c-more">${T.showMore(Math.min(PAGE, rows.length - C.limit))}</button></div>` : ""}`;
  $("#c-level").addEventListener("change", (e) => { C.level = e.target.value; renderChanges(); });
  $("#c-status").addEventListener("change", (e) => { C.status = e.target.value; renderChanges(); });
  $("#c-q").addEventListener("input", (e) => { C.q = e.target.value; renderChanges(); const x = $("#c-q"); x.focus(); x.setSelectionRange(x.value.length, x.value.length); });
  const more = $("#c-more");
  if (more) more.addEventListener("click", () => { C.limit += PAGE; renderChanges(); });
  sec.querySelectorAll("tr.item-row").forEach((tr) => tr.addEventListener("click", () => {
    cmpOpen = cmpOpen === tr.dataset.id ? null : tr.dataset.id; renderChanges();
  }));
}

// ---------- boot ----------
document.title = (DATA.kind === "compare" ? T.compareReport : T.report) + " – " + DATA.task.name;
$("#main").innerHTML = TABS.map((t) => `<section id="tab-${t}" role="tabpanel"${t === "overview" ? "" : " hidden"}></section>`).join("");
renderHeader();
renderTabs();
if (DATA.kind === "compare") {
  renderCompareOverview(); renderChanges(); renderDetails();
} else {
  renderOverview(); renderClasses(); renderItems(); renderChecks(); renderDetails();
}
</script>
</body>
</html>
